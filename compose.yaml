services:
  db:
    image: postgres:17.11
    command: ["postgres", "-p", "5437"]
    environment:
      POSTGRES_DB: order_api
      POSTGRES_USER: order_api
      POSTGRES_PASSWORD: order_api_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5437"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_api -d order_api -p 5437"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://order_api:order_api_local@db:5437/order_api
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m scripts.seed_products &&
      uvicorn order_api.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
